global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - <TARGET_PRIVATE_IP>:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - <TARGET_PRIVATE_IP>:8080

# Uncomment after Alertmanager is installed.
# alerting:
#   alertmanagers:
